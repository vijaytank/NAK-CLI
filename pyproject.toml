[project]
name = "nak-cli"
version = "0.1.0"
description = "A local-first, workspace-scoped, language-agnostic AI coding CLI"
readme = "README.md"
authors = [
    { name = "Vijay Tank", email = "vijaytank130@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "prompt-toolkit>=3.0.40",
    "click",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
nak = "nak.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nak"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
